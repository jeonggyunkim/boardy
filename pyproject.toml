[project]
name = "deepsea"
version = "0.1.0"
description = "Deep Sea Crew (The Crew: Mission Deep Sea) rules engine, AI player, and online play service"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
deepsea-cli = "deepsea.cli:main"
deepsea-train = "deepsea.train:main"
deepsea-eval = "deepsea.evaluate:main"
deepsea-web = "deepsea.web.server:run"
