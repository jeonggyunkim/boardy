[project]
name = "boardy"
version = "0.1.0"
description = "AI companions for board games, playable online with friends. Games: Deep Sea Crew, Gomoku."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "numba>=0.60",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
boardy-cli = "boardy.cli:main"
boardy-web = "boardy.web.server:run"
deepsea-cli = "boardy.games.deep_sea_crew.cli:main"
deepsea-train = "boardy.games.deep_sea_crew.train:main"
deepsea-eval = "boardy.games.deep_sea_crew.evaluate:main"
gomoku-cli = "boardy.games.gomoku.cli:main"
gomoku-train = "boardy.games.gomoku.train:main"
gomoku-eval = "boardy.games.gomoku.evaluate:main"
gomoku-remote-selfplay = "boardy.games.gomoku.remote_selfplay:main"
