<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Boardy Online</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1>Boardy <span class="subtitle">— AI와 함께 온라인 보드게임</span></h1>

  <section id="landing">
    <div class="panel">
      <h2>새 방 만들기</h2>
      <label>게임 <select id="gameSelect"></select></label>
      <p id="gameDesc" class="hint"></p>
      <label>인원수 <input id="np" type="number" min="2" max="5" value="3"></label>
      <label id="diffLabel">난이도 <input id="diff" type="number" min="1" max="20" value="8"></label>
      <label>이름 <input id="createName" value="player"></label>
      <button id="createBtn">방 만들기</button>
    </div>
    <div class="panel">
      <h2>방 참가</h2>
      <label>방 코드 <input id="joinCode" maxlength="5" style="text-transform:uppercase"></label>
      <label>이름 <input id="joinName" value="player"></label>
      <button id="joinBtn">참가</button>
    </div>
  </section>

  <section id="seatPicker" class="hidden">
    <h2>방 코드: <span id="pickerRoomCode"></span> — 좌석 선택</h2>
    <div id="seatButtons"></div>
    <p class="hint">오목이면 Player 0 = 흑, Player 1 = 백입니다.</p>
  </section>

  <section id="lobby" class="hidden">
    <h2>방 코드: <span id="roomCode"></span></h2>
    <ul id="seatList"></ul>
    <label>AI 종류
      <select id="aiMode">
        <option value="smart" selected>스마트 (학습된 AI + 탐색, 느림)</option>
        <option value="random">랜덤</option>
      </select>
    </label>
    <button id="addAiBtn">AI 추가</button>
    <button id="startBtn">게임 시작</button>
  </section>

  <section id="game" class="hidden">
    <div id="outcomeBanner" class="hidden"></div>

    <div id="dscView">
      <div id="playerBoards"></div>

      <div id="draftView">
        <h3><span id="draftStatus"></span></h3>
        <div id="draftPool"></div>
        <h3>내 손패</h3>
        <div id="draftHand"></div>
      </div>

      <div id="playView">
        <div id="table"></div>
        <button id="nextTrickBtn" class="hidden">다음</button>
        <h3>내 손패 (<span id="turnIndicator"></span>)</h3>
        <p class="hint">통신 가능한 카드는 카드 위/가운데/아래에 토큰이 표시됩니다 (최고/유일/최저).</p>
        <div id="hand"></div>
      </div>
    </div>

    <div id="gomokuView" class="hidden">
      <h3><span id="gomokuStatus"></span></h3>
      <div id="gomokuBoard"></div>
    </div>

    <div id="postGameControls" class="hidden">
      <button id="playAgainBtn">다시 플레이</button>
      <button id="homeBtn">홈으로 돌아가기</button>
    </div>
  </section>

<script src="/app.js"></script>
</body>
</html>
